name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (flake8 - errors only, style is not blocking)
        run: |
          flake8 src api tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Generate synthetic dataset
        run: python data/generate_data.py

      - name: Train models (populates model registry used by API tests)
        run: python -m src.train

      - name: Run test suite
        run: pytest tests/ -v --maxfail=1

      - name: Upload model comparison artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-comparison-report
          path: artifacts/model_comparison.json

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t credit-risk-api:${{ github.sha }} .
